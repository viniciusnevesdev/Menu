name: Atualizar catalogo de PWAs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descobrir PWAs publicados
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const excluded = new Set([context.repo.repo]);
            const repos = [];

            for (let page = 1; ; page += 1) {
              const { data } = await github.rest.repos.listForUser({
                username: owner,
                type: "owner",
                per_page: 100,
                page
              });
              repos.push(...data);
              if (data.length < 100) break;
            }

            const resolveUrl = (base, value) => new URL(value || "./", base).href;
            const candidates = repos.filter(repo => repo.has_pages && !repo.archived && !excluded.has(repo.name));
            const apps = [];
            const failures = [];

            for (const repo of candidates) {
              try {
                const { data: tree } = await github.rest.git.getTree({
                  owner,
                  repo: repo.name,
                  tree_sha: repo.default_branch,
                  recursive: "true"
                });
                const manifests = tree.tree.filter(file =>
                  file.type === "blob" &&
                  /(^|\\/)(manifest\\.(webmanifest|json)|site\\.webmanifest)$/i.test(file.path)
                );

                for (const file of manifests) {
                  try {
                    const { data } = await github.rest.repos.getContent({
                      owner,
                      repo: repo.name,
                      path: file.path,
                      ref: repo.default_branch
                    });
                    if (Array.isArray(data)) continue;
                    const manifest = JSON.parse(Buffer.from(data.content, "base64").toString("utf8"));
                    if (!["standalone", "minimal-ui", "fullscreen"].includes(manifest.display)) continue;
                    if (!(manifest.name || manifest.short_name)) continue;

                    const directory = file.path.includes("/")
                      ? file.path.split("/").slice(0, -1).map(encodeURIComponent).join("/") + "/"
                      : "";
                    const base = "https://" + owner + ".github.io/" + encodeURIComponent(repo.name) + "/" + directory;
                    const icons = Array.isArray(manifest.icons) ? manifest.icons : [];
                    const icon = icons.find(item => /512/.test(item.sizes || "")) || icons.find(item => item.src);

                    apps.push({
                      name: manifest.short_name || manifest.name,
                      repo: repo.name,
                      url: resolveUrl(base, manifest.start_url),
                      icon: icon && icon.src ? resolveUrl(base, icon.src) : "",
                      color: manifest.theme_color || "#596277",
                      manifest: file.path
                    });
                  } catch (error) {
                    failures.push({ repo: repo.name, manifest: file.path, reason: String(error.message || error) });
                  }
                }
              } catch (error) {
                failures.push({ repo: repo.name, stage: "tree", reason: String(error.message || error) });
              }
            }

            apps.sort((a, b) =>
              a.repo.localeCompare(b.repo, "pt-BR") ||
              a.name.localeCompare(b.name, "pt-BR")
            );

            fs.writeFileSync("apps.json", JSON.stringify({
              schema: 1,
              generatedAt: new Date().toISOString(),
              apps,
              failures
            }, null, 2) + "\n");

      - name: Salvar catalogo atualizado
        run: |
          if git diff --quiet -- apps.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Atualiza catalogo de PWAs"
          git push
