name: Atualizar catalogo de PWAs

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps.json"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descobrir PWAs publicados
        uses: actions/github-script@v7
        with:
          script: |
            const build = require('./scripts/build-catalog.cjs');
            await build({github, context});

      - name: Salvar catalogo atualizado
        run: |
          if git diff --quiet -- apps.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Atualiza catalogo de PWAs"
          git push
